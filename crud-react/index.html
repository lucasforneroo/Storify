<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor CRUD con LocalStorage</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="content">
      <h1>STORIFY</h1>
    </div>
    <div class="buttons">
      <button id="tareas-completadas">+</button>
      <button id="tareas-faltantes">-</button>
      </div>
    </div>
  </header>

  <!-- Modal de clasificación de tareas -->
  <div id="modal-clasificacion" class="modal">
    <div class="modal-content fade">
      <h3>Selecciona el tipo de tarea</h3>
      <div class="tipos-tarea">
        <button class="tipo-tarea" data-tipo="universidad">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18L12 21L19 17.18V13.18L12 17L5 13.18Z" fill="currentColor"/>
          </svg>
          Deberes universitarios
        </button>
        <button class="tipo-tarea" data-tipo="deporte">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20ZM6.5 17.5L14.01 14.01L17.5 6.5L9.99 9.99L6.5 17.5Z" fill="currentColor"/>
          </svg>
          Deportivas
        </button>
        <button class="tipo-tarea" data-tipo="urgente">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L1 21H23L12 2ZM12 6L19.53 19H4.47L12 6ZM11 10V14H13V10H11ZM11 16V18H13V16H11Z" fill="currentColor"/>
          </svg>
          Urgentes
        </button>
        <button class="tipo-tarea" data-tipo="rutina">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20ZM12.5 7H11V13L16.2 16.2L17 14.9L12.5 12.2V7Z" fill="currentColor"/>
          </svg>
          Rutinarias
        </button>
        <button class="tipo-tarea" data-tipo="otros">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 5V19H5V5H19ZM19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3ZM14.14 11.86L11.14 15.73L9 13.14L6 17H18L14.14 11.86Z" fill="currentColor"/>
          </svg>
          Otros
        </button>
      </div>
    </div>
  </div>

  <main>
    <!-- Sección de sesión -->
    <section id="seccion-sesion">
      <h2>Bienvenido a Storify!</h2>
      <div id="sesion-activa">
        <p id="usuario-saludo"></p>
        <button id="cerrar-sesion">Cerrar sesión</button>
      </div>
      <div id="sesion-form">
        <input type="text" id="nombre-usuario" placeholder="Ingrese su usuario" />
        <button id="iniciar-sesion">Iniciar sesión</button>
      </div>
    </section>

    <hr />
    <!-- Sección de tareas -->
    <section id="seccion-tareas">
      <h2>Tareas</h2>
      <div class="input-group">
        <input type="text" id="nueva-tarea" placeholder="Escribe una tarea..." />
        <button id="agregar-tarea">Agregar</button>
      </div>

      <!-- Sección de búsqueda y filtros -->
      <div class="search-section">
        <div class="search-box">
          <input type="text" id="buscar-tarea" placeholder="Buscar tareas..." />
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15.5 14H14.71L14.43 13.73C15.41 12.59 16 11.11 16 9.5C16 5.91 13.09 3 9.5 3C5.91 3 3 5.91 3 9.5C3 13.09 5.91 16 9.5 16C11.11 16 12.59 15.41 13.73 14.43L14 14.71V15.5L19 20.49L20.49 19L15.5 14ZM9.5 14C7.01 14 5 11.99 5 9.5C5 7.01 7.01 5 9.5 5C11.99 5 14 7.01 14 9.5C14 11.99 11.99 14 9.5 14Z" fill="currentColor"/>
          </svg>
        </div>
        <div class="filter-options">
          <select id="filtro-categoria">
            <option value="todas">Todas las categorías</option>
            <option value="universidad">Universidad</option>
            <option value="deporte">Deportes</option>
            <option value="urgente">Urgentes</option>
            <option value="rutina">Rutina</option>
            <option value="otros">Otros</option>
          </select>
          <select id="filtro-orden">
            <option value="recientes">Más recientes</option>
            <option value="alfabetico">Alfabético</option>
            <option value="categoria">Por categoría</option>
          </select>
        </div>
      </div>

      <ul id="lista-tareas"></ul>
    </section>
  </main>

  <footer>
    <p>Hecho por Lucas fornero</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
